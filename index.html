<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeeConmigo - ¡Aprende a leer con IA!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue-50 text-gray-800 min-h-screen">

    <div id="app" class="max-w-3xl mx-auto p-4 sm:p-6">
        
        <section id="screen-login" class="screen-active bg-white rounded-3xl shadow-xl p-8 text-center mt-10">
            <h1 class="text-4xl font-extrabold text-blue-600 mb-2">📚 LeeConmigo</h1>
            <p class="text-lg text-gray-500 mb-8">¡Descubre mundos increíbles leyendo!</p>
            
            <div class="space-y-4 max-w-sm mx-auto">
                <input type="text" id="input-name" placeholder="Tu Nombre" class="w-full text-xl p-4 border-4 border-blue-100 rounded-2xl focus:outline-none focus:border-blue-400">
                <input type="number" id="input-age" placeholder="Tu Edad (6-12)" min="6" max="12" class="w-full text-xl p-4 border-4 border-blue-100 rounded-2xl focus:outline-none focus:border-blue-400">
                <button id="btn-start" class="w-full bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-4 rounded-2xl shadow-lg transform transition active:scale-95">¡Empezar a jugar!</button>
            </div>
        </section>

        <section id="screen-dashboard" class="screen-hidden">
            <div class="bg-white rounded-3xl shadow-md p-6 mb-6 flex justify-between items-center border-b-4 border-blue-200">
                <div class="flex items-center gap-4">
                    <div class="text-5xl bg-blue-100 rounded-full p-2">👦</div>
                    <div>
                        <h2 class="text-2xl font-bold text-gray-700" id="dash-name">Hola, --</h2>
                        <p class="text-gray-500 font-semibold">Nivel Actual: <span id="dash-level" class="text-blue-600 text-xl">1</span></p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-xl font-bold text-yellow-500">⭐ <span id="dash-stars">0</span></p>
                    <p class="text-sm text-gray-400">Estrellas</p>
                </div>
            </div>

            <h3 class="text-2xl font-bold mb-4 text-center text-gray-700">¿De qué quieres leer hoy?</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                <button class="theme-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800 border-2 border-yellow-300 font-bold py-4 rounded-2xl text-xl" data-theme="Animales">🦁 Animales</button>
                <button class="theme-btn bg-green-100 hover:bg-green-200 text-green-800 border-2 border-green-300 font-bold py-4 rounded-2xl text-xl" data-theme="Aventura">🗺️ Aventura</button>
                <button class="theme-btn bg-purple-100 hover:bg-purple-200 text-purple-800 border-2 border-purple-300 font-bold py-4 rounded-2xl text-xl" data-theme="Ciencia">🔬 Ciencia</button>
                <button class="theme-btn bg-gray-100 hover:bg-gray-200 text-gray-800 border-2 border-gray-300 font-bold py-4 rounded-2xl text-xl" data-theme="Misterio">🕵️ Misterio</button>
                <button class="theme-btn bg-orange-100 hover:bg-orange-200 text-orange-800 border-2 border-orange-300 font-bold py-4 rounded-2xl text-xl" data-theme="Deportes">⚽ Deportes</button>
                <button class="theme-btn bg-pink-100 hover:bg-pink-200 text-pink-800 border-2 border-pink-300 font-bold py-4 rounded-2xl text-xl" data-theme="Amistad">🤝 Amistad</button>
            </div>
        </section>

        <section id="screen-reading" class="screen-hidden">
            <div id="loading-spinner" class="text-center py-20 hidden">
                <div class="text-6xl animate-bounce mb-4">🪄</div>
                <h3 class="text-2xl font-bold text-gray-600">Creando un cuento mágico...</h3>
            </div>

            <div id="reading-content" class="hidden">
                <div class="bg-[#fdfbf7] rounded-3xl shadow-lg p-6 md:p-10 border-2 border-gray-200 mb-6">
                    <button id="btn-read-aloud" class="mb-4 bg-blue-100 text-blue-700 px-4 py-2 rounded-xl font-bold hover:bg-blue-200">🔊 Leer en voz alta</button>
                    <p id="story-text" class="text-2xl md:text-3xl leading-relaxed text-gray-800"></p>
                </div>
                <button id="btn-to-questions" class="w-full bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-4 rounded-2xl shadow-lg">¡Terminé de leer!</button>
            </div>

            <div id="questions-content" class="hidden">
                <div class="bg-white rounded-3xl shadow-lg p-6 md:p-10">
                    <h3 class="text-2xl font-bold mb-6 text-blue-600" id="question-title">Pregunta 1 de 5</h3>
                    <p class="text-xl font-bold mb-6 text-gray-800" id="question-text"></p>
                    <div id="options-container" class="space-y-4">
                        </div>
                    <div id="feedback-message" class="mt-6 text-2xl font-bold text-center hidden"></div>
                </div>
            </div>
        </section>

        <section id="screen-results" class="screen-hidden text-center bg-white rounded-3xl shadow-xl p-10 mt-10">
            <div class="text-6xl mb-4" id="result-emoji">🎉</div>
            <h2 class="text-4xl font-extrabold text-blue-600 mb-4" id="result-title">¡Buen trabajo!</h2>
            <p class="text-2xl font-bold text-gray-600 mb-2">Aciertos: <span id="result-score" class="text-green-500">4/5</span></p>
            <p class="text-lg text-gray-500 mb-8" id="result-level-msg"></p>
            <button id="btn-home" class="bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold py-4 px-8 rounded-2xl shadow-lg">Volver al inicio</button>
        </section>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
